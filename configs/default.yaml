# Turtle Analytics Configuration
# This file defines the optimization settings for Phase 3 (Bayesian Optimization)
# and MetaTrader 5 connection settings for data loading

# MetaTrader 5 Data Source Configuration
metatrader:
  # Connection credentials (leave null to use current logged-in account)
  login: null  # MT5 account number (e.g., 12345678)
  password: null  # MT5 account password (use environment variable for security)
  server: null  # Broker server name (e.g., "Broker-Demo" or "Broker-Live")

  # Data retrieval settings
  days_history: 90  # Number of days to fetch from MT5 (default: 90)
  symbol: null  # Filter by symbol (e.g., "EURUSD"), null = all symbols

  # Performance options
  calculate_mfe_mae: false  # Calculate MFE/MAE from tick data (slow, experimental)

  # Security note: For production use, store credentials in environment variables:
  # export MT5_LOGIN=12345678
  # export MT5_PASSWORD=yourpassword
  # export MT5_SERVER=YourBroker-Live
  # Then reference them in your script with os.getenv()

optimization:
  # What metric to optimize (maximize)
  objective_metric: "avg_R"
  
  # Number of optimization trials to run
  # More trials = better results but slower
  # Recommended: 50-100 for quick runs, 200+ for production
  n_trials: 100
  
  # Random seed for reproducibility
  random_seed: 42
  
  # Parameter search space
  # Defines the ranges that the optimizer will explore
  search_space:
    # Stop-loss multiplier: how tight/wide to set stops
    # 0.5 = half the original stop distance (tighter)
    # 1.0 = original stop distance
    # 2.0 = double the original stop distance (wider)
    sl_mult:
      type: "float"
      low: 0.3
      high: 2.0
    
    # Take-profit multiplier: how close/far to set targets
    # 0.5 = half the original target distance (closer)
    # 1.0 = original target distance
    # 3.0 = triple the original target distance (further)
    tp_mult:
      type: "float"
      low: 0.5
      high: 3.0
    
    # Trailing stop percentage
    # 0.0 = no trailing stop
    # 0.02 = 2% trailing stop
    # 0.1 = 10% trailing stop (very wide)
    trail_pct:
      type: "float"
      low: 0.0
      high: 0.1
    
    # Maximum hold time in minutes
    # null = no time limit
    # 60 = force exit after 1 hour
    # 240 = force exit after 4 hours
    max_hold_minutes:
      type: "categorical"
      choices: [null, 60, 120, 180, 240, 360]
    
    # Risk fraction: percentage of capital to risk per trade
    # 0.005 = 0.5% (very conservative)
    # 0.01 = 1% (standard)
    # 0.03 = 3% (aggressive)
    risk_fraction:
      type: "float"
      low: 0.005
      high: 0.03
  
  # Uncertainty estimation settings
  uncertainty:
    # Enable bootstrap resampling for confidence intervals
    enabled: true
    
    # Number of top policies to estimate uncertainty for
    # (only the best N will be analyzed)
    top_n: 5
    
    # Number of bootstrap samples
    # More = better estimates but slower
    # 100 = quick test, 1000 = production
    n_bootstrap: 1000
    
    # Confidence level for intervals (0.95 = 95% CI)
    confidence_level: 0.95