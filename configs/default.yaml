paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  artifacts_dir: "artifacts"

ingest:
  trade_file_pattern: "*.csv"

simulation:
  baseline:
    sl_mult: 1.0
    tp_mult: 1.0
    max_hold_minutes: 240
    trail_pct: 0.0
    risk_fraction: 0.01

optimization:
  n_trials: 100
  objective_metric: "avg_R"
  ranges:
    sl_mult: [0.5, 1.5]
    tp_mult: [1.0, 3.0]
    max_hold_minutes: [15, 480]
    trail_pct: [0.0, 0.5]
    risk_fraction: [0.005, 0.03]

clustering:
  algorithm: "kmeans"
  n_clusters: 4
  features:
    - volatility
    - spread
    - session
    - symbol
    - duration_minutes
    - mfe
    - mae

reporting:
  output_path: "artifacts/report.json"
